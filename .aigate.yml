version: 1
fail_threshold: 70
warn_threshold: 40
languages: [java, js, py]
require_tests_for_paths:
  - "src/main/**"
  - "src/**/*.java"
coverage_min: 0.65
secret_rules:
  - name: AWS_ACCESS_KEY
    pattern: "AKIA[0-9A-Z]{16}"
  - name: AWS_SECRET_KEY
    pattern: "[A-Za-z0-9/+=]{40}"
  - name: GenericHighEntropy
    entropy_bits: 80
  - name: API_KEY
    pattern: "(?i)(api[_-]?key|apikey)\\s*[:=]\\s*['\"]?[a-zA-Z0-9]{20,}['\"]?"
  - name: PASSWORD
    pattern: "(?i)(password|passwd|pwd)\\s*[:=]\\s*['\"]?[^\\s]{8,}['\"]?"
insecure_banlist:
  - "MessageDigest.getInstance(\"MD5\")"
  - "eval("
  - "exec("
  - "Runtime.getRuntime().exec("
  - "ProcessBuilder("
  - "System.setProperty("
  - "System.getenv("
  - "new FileInputStream("
  - "FileOutputStream("
  - "Random()"
  - "Math.random()"
model: "claude-sonnet-4-20250514"
max_tokens: 2000
temperature: 0.1
timeout_seconds: 300
max_retries: 2
